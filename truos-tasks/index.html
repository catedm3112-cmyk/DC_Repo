<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TruOS"><title>TruOS Tasks</title><style>
:root{--bg:#07101d;--p:#101d30;--p2:#14243a;--t:#f5f7fb;--m:#8795a8;--line:#ffffff16;--a:#d7ff5f;--r:#ff6f78}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172a45,#07101d 38%,#040a12);color:var(--t);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.wrap{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 90px)}header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 18px}.eye{font-size:10px;letter-spacing:.22em;color:var(--m);font-weight:800;margin:0 0 4px}h1{font-size:30px;letter-spacing:-.05em;margin:0}.add{width:46px;height:46px;border:0;border-radius:15px;background:var(--a);font-size:28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stats button{border:1px solid var(--line);background:#0f1c2ee6;color:var(--t);border-radius:15px;padding:12px 7px;text-align:left}.stats b{font-size:21px;display:block}.stats small{font-size:9px;color:var(--m)}.stats .on{border-color:#d7ff5f66;background:#d7ff5f12}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0 19px}.search input,.search button{border:1px solid var(--line);background:#0f1c2e;color:var(--t);border-radius:13px;padding:12px}.section{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin:0 3px 9px}.link{border:0;background:none;color:var(--a)}.list{display:grid;gap:9px}.task{display:flex;gap:11px;border:1px solid var(--line);background:linear-gradient(#122138,#0a1627);border-radius:17px;padding:14px}.check{width:23px;height:23px;flex:0 0 23px;border-radius:50%;border:1.5px solid #ffffff38;background:none;color:#07101d;padding:0}.done{opacity:.52}.done .check{background:var(--a);border-color:var(--a)}.done h3{text-decoration:line-through}.main{min-width:0;flex:1}h3{font-size:15px;margin:0 0 8px}.meta,.foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--m)}.foot{margin-top:8px}.pill,.due,.status{border:1px solid var(--line);border-radius:999px;padding:4px 7px}.terra{color:#66d5b4}.built{color:#91adff}.realty{color:#e0a6ff}.over{color:#ff8088}.prio{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px}.critical{background:#ff5f70}.high{background:#ffb45c}.medium{background:#79b7ff}.low{background:#6ad9ae}.empty{border:1px dashed var(--line);border-radius:17px;padding:38px 16px;text-align:center;color:var(--m)}.nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);width:min(690px,calc(100% - 22px));display:grid;grid-template-columns:repeat(4,1fr) 45px;gap:4px;padding:7px;background:#07101de8;backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px}.nav button{border:0;background:none;color:#77859a;font-size:10px;padding:10px 2px;border-radius:12px}.nav .on{color:var(--t);background:#ffffff0a}.nav .plus{background:var(--a);color:#07101d;font-size:24px;padding:0}.shade{position:fixed;inset:0;background:#0009;backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0b1625;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);border:1px solid var(--line)}.grab{width:40px;height:5px;border-radius:10px;background:#ffffff22;margin:0 auto 14px}.sheet h2{margin:0 0 14px}.form{display:grid;gap:11px}.form label,.gate label{display:grid;gap:6px;color:var(--m);font-size:11px;font-weight:700}.form input,.form select,.form textarea,.gate input{width:100%;border:1px solid var(--line);background:#101e31;color:var(--t);border-radius:12px;padding:12px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{border:0;border-radius:13px;background:var(--a);color:#07101d;font-weight:800;padding:13px}.danger{color:var(--r)!important}.gatebox{min-height:100vh;display:grid;place-items:center;padding:24px}.gate{width:min(420px,100%);background:linear-gradient(#122138,#091525);border:1px solid var(--line);border-radius:25px;padding:26px}.mark{width:46px;height:46px;border-radius:14px;background:var(--a);color:#07101d;display:grid;place-items:center;font-size:23px;font-weight:900}.gate p{color:var(--m);line-height:1.5}.err{color:#ff8991;font-size:12px}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#eef6d1;color:#07101d;border-radius:11px;padding:9px 13px;font-size:11px;font-weight:800;z-index:20}@media(max-width:520px){.grid{grid-template-columns:1fr}.search{grid-template-columns:1fr}.stats{gap:5px}.stats small{font-size:8px}}
</style></head><body><div id="app"></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm';
const U='https://narvmzxjdsonxchgypum.supabase.co',K='sb_publishable_weJjQDEtW_zs7r_SzynZyA_PJr8LB7i',S='truos.code.v1';let db=null,tasks=[],view='Today',q='',edit=null;const A=document.getElementById('app'),today=()=>new Date().toLocaleDateString('en-CA'),done=t=>['done','cancelled'].includes(t.status),over=t=>!done(t)&&t.due_date&&t.due_date<today(),e=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function client(code){return createClient(U,K,{auth:{persistSession:false},global:{headers:{'x-truos-key':code}}})}async function valid(code){let c=client(code),{data}=await c.from('truos_config').select('app_name').eq('id',1).maybeSingle();return data?.app_name?c:null}function fmt(d){if(!d)return'No due date';if(d===today())return'Today';let x=new Date(d+'T12:00:00'),n=new Date(),z=new Date(n.getFullYear(),n.getMonth(),n.getDate()),df=Math.round((x-z)/864e5);if(df===1)return'Tomorrow';if(df===-1)return'Yesterday';return x.toLocaleDateString(undefined,{month:'short',day:'numeric'})}function bc(b){return b==='TruTerra'?'terra':b==='TruBuilt'?'built':b==='TruRealty'?'realty':''}function cnt(s){if(s==='Today')return tasks.filter(t=>!done(t)&&t.due_date===today()).length;if(s==='Decisions')return tasks.filter(t=>!done(t)&&t.status==='decision').length;if(s==='Waiting')return tasks.filter(t=>!done(t)&&t.status==='waiting').length;return tasks.filter(over).length}function filt(t){if(view==='All')return!t.archived;if(view==='Today'){let d=new Date();d.setDate(d.getDate()+7);return!done(t)&&(!t.due_date||t.due_date<=d.toLocaleDateString('en-CA'))}if(view==='Decisions')return!done(t)&&t.status==='decision';if(view==='Waiting')return!done(t)&&t.status==='waiting';if(view==='Overdue')return over(t);return!done(t)&&t.business===view}function list(){return tasks.filter(filt).filter(t=>!q||[t.title,t.project,t.owner,t.business,t.notes,t.source].some(x=>String(x||'').toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>(over(b)-over(a))||({critical:0,high:1,medium:2,low:3}[a.priority]-({critical:0,high:1,medium:2,low:3}[b.priority]))||String(a.due_date||'9999').localeCompare(String(b.due_date||'9999')))}
function gate(msg=''){A.innerHTML=`<div class="gatebox"><div class="gate"><div class="mark">T</div><p class="eye" style="margin-top:18px">TRUTERRA GROUP</p><h1>TruOS Tasks</h1><p>Your operating list for TruTerra, TruBuilt and TruRealty.</p><form id="g"><label>Private access code<input id="code" type="password" required></label>${msg?`<p class="err">${e(msg)}</p>`:''}<button class="primary" style="width:100%;margin-top:14px">Open task cockpit</button></form></div></div>`;g.onsubmit=async x=>{x.preventDefault();let b=g.querySelector('button');b.textContent='Checking…';b.disabled=true;let code=document.getElementById('code').value.trim(),c=await valid(code);if(!c)return gate('That code did not unlock TruOS.');localStorage.setItem(S,code);db=c;load()}}
async function load(){let{data,error}=await db.from('truos_tasks').select('*').order('updated_at',{ascending:false});if(error)return gate('Access needs to be refreshed.');tasks=data||[];render()}
function card(t){return`<article class="task ${done(t)?'done':''}" data-id="${t.id}"><button class="check" data-check="${t.id}">${done(t)?'✓':''}</button><div class="main"><h3><span class="prio ${e(t.priority)}"></span>${e(t.title)}</h3><div class="meta"><span class="pill ${bc(t.business)}">${e(t.business)}</span>${t.project?`<span>${e(t.project)}</span>`:''}${t.owner?`<span>${e(t.owner)}</span>`:''}</div><div class="foot"><span class="due ${over(t)?'over':''}">${fmt(t.due_date)}</span><span class="status">${e((t.status||'open').replace('_',' '))}</span><span>${e(t.verification||'')}</span></div></div></article>`}
function render(){let L=list();A.innerHTML=`<div class="wrap"><header><div><p class="eye">TRUOS</p><h1>${e(view)}</h1></div><button id="add" class="add">+</button></header><div class="stats">${['Today','Decisions','Waiting','Overdue'].map(s=>`<button data-v="${s}" class="${view===s?'on':''}"><b>${cnt(s)}</b><small>${s}</small></button>`).join('')}</div><div class="search"><input id="search" value="${e(q)}" placeholder="Search tasks, projects, people…"><button id="biz">Business</button></div><div class="section"><span><b>${L.length}</b> ${L.length===1?'item':'items'}</span><button id="all" class="link">${view==='All'?'Open focus':'View all'}</button></div><div class="list">${L.length?L.map(card).join(''):`<div class="empty"><b>Clear</b><p>No ${e(view.toLowerCase())} items right now.</p></div>`}</div></div><nav class="nav">${['Today','TruTerra','TruBuilt','TruRealty'].map(s=>`<button data-v="${s}" class="${view===s?'on':''}">${s==='Today'?'Today':s.slice(3)}</button>`).join('')}<button id="plus" class="plus">+</button></nav><div id="modal"></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});search.oninput=x=>{q=x.target.value;render();setTimeout(()=>document.getElementById('search')?.focus(),0)};add.onclick=plus.onclick=()=>form();all.onclick=()=>{view=view==='All'?'Today':'All';render()};biz.onclick=picker;document.querySelectorAll('.task').forEach(c=>c.onclick=x=>{if(x.target.closest('.check'))return;form(tasks.find(t=>t.id===c.dataset.id))});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=async x=>{x.stopPropagation();let t=tasks.find(t=>t.id===b.dataset.check),s=done(t)?'open':'done';await db.from('truos_tasks').update({status:s,completed_at:s==='done'?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',t.id);load()})}
function picker(){modal.innerHTML=`<div class="shade" id="shade"><div class="sheet"><div class="grab"></div><h2>Business view</h2>${['TruTerra','TruBuilt','TruRealty','All'].map(s=>`<button data-p="${s}" class="link" style="width:100%;padding:14px;text-align:left;border-top:1px solid var(--line)">${s}</button>`).join('')}<button id="lock" class="link danger" style="width:100%;padding:14px;text-align:left;border-top:1px solid var(--line)">Lock this device</button></div></div>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{view=b.dataset.p;modal.innerHTML='';render()});lock.onclick=()=>{localStorage.removeItem(S);db=null;gate()}}
function form(t=null){edit=t;let x=t||{business:'TruTerra',priority:'high',status:'open',verification:'unconfirmed'};modal.innerHTML=`<div class="shade" id="shade"><div class="sheet"><div class="grab"></div><div style="display:flex;justify-content:space-between"><h2>${t?'Edit item':'New item'}</h2>${t?'<button id="arc" class="link danger">Archive</button>':''}</div><form id="f" class="form"><label>Task<input name="title" value="${e(x.title||'')}" required></label><div class="grid"><label>Business<select name="business">${['TruTerra','TruBuilt','TruRealty','Cross-Business'].map(v=>`<option ${x.business===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Priority<select name="priority">${['critical','high','medium','low'].map(v=>`<option ${x.priority===v?'selected':''}>${v}</option>`).join('')}</select></label></div><label>Project / property<input name="project" value="${e(x.project||'')}"></label><div class="grid"><label>Owner<input name="owner" value="${e(x.owner||'')}"></label><label>Due date<input name="due_date" type="date" value="${e(x.due_date||'')}"></label></div><div class="grid"><label>Status<select name="status">${['open','in_progress','waiting','decision','done','cancelled'].map(v=>`<option value="${v}" ${x.status===v?'selected':''}>${v.replace('_',' ')}</option>`).join('')}</select></label><label>Verification<select name="verification">${['verified','target','assumption','unconfirmed'].map(v=>`<option ${x.verification===v?'selected':''}>${v}</option>`).join('')}</select></label></div><label>Source<input name="source" value="${e(x.source||'')}"></label><label>Notes<textarea name="notes" rows="4">${e(x.notes||'')}</textarea></label><button class="primary">${t?'Save changes':'Add task'}</button></form></div></div>`;shade.onclick=y=>{if(y.target===shade)modal.innerHTML=''};f.onsubmit=save;if(t)arc.onclick=async()=>{await db.from('truos_tasks').update({archived:true}).eq('id',t.id);modal.innerHTML='';load()}}
async function save(x){x.preventDefault();let p=Object.fromEntries(new FormData(f));for(let k in p)if(!p[k])p[k]=null;p.updated_at=new Date().toISOString();let r=edit?await db.from('truos_tasks').update(p).eq('id',edit.id):await db.from('truos_tasks').insert(p);if(r.error)return alert(r.error.message);modal.innerHTML='';load()}
(async()=>{let code=localStorage.getItem(S);if(!code)return gate();db=await valid(code);if(!db){localStorage.removeItem(S);return gate('Enter the private code to continue.')}load()})();
</script></body></html>
